<!DOCTYPE html>
<html class="h-full" lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>BĐS Suite • Đăng nhập</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { margin: 0; padding: 0; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-[#f8fafc] sm:bg-slate-200 font-sans text-slate-800 flex justify-center min-h-screen antialiased">

<div class="w-full max-w-[430px] min-h-screen bg-[#f8fafc] flex flex-col px-5 py-8 gap-6">

  <!-- Thương hiệu -->
  <div class="flex flex-col items-center gap-2.5 pt-6">
    <div class="w-16 h-16 rounded-3xl bg-gradient-to-tr from-[#0f3d64] to-[#1e588a] text-white flex items-center justify-center shadow-lg shadow-[#0f3d64]/25">
      <span class="material-symbols-outlined text-[32px]">apartment</span>
    </div>
    <h1 class="text-lg font-extrabold text-slate-900">BĐS Suite</h1>
    <p class="text-xs text-slate-500 text-center leading-relaxed max-w-[280px]">Đăng nhập để tiếp tục. Mỗi tài khoản gắn với một vai trò: Sale hoặc Nhân sự (HR).</p>
  </div>

  <!-- Form đăng nhập -->
  <form id="loginForm" onsubmit="submitLogin(event)" class="p-4 rounded-3xl bg-white border border-slate-200 shadow-xs flex flex-col gap-3" novalidate>
    <div class="flex flex-col gap-1">
      <label for="loginUser" class="text-xs font-bold text-slate-700">Tên đăng nhập</label>
      <div class="relative">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[20px] text-slate-400">person</span>
        <input id="loginUser" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="VD: huy.nguyen" oninput="clearLoginError()"
          class="w-full h-11 pl-10 pr-3 rounded-xl bg-slate-50 border border-slate-200 text-xs font-semibold text-slate-800 placeholder:text-slate-400 placeholder:font-normal focus:outline-none focus:ring-2 focus:ring-[#0f3d64]/20 focus:bg-white"/>
      </div>
    </div>
    <div class="flex flex-col gap-1">
      <label for="loginPass" class="text-xs font-bold text-slate-700">Mật khẩu</label>
      <div class="relative">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[20px] text-slate-400">lock</span>
        <input id="loginPass" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" oninput="clearLoginError()"
          class="w-full h-11 pl-10 pr-11 rounded-xl bg-slate-50 border border-slate-200 text-xs font-semibold text-slate-800 placeholder:text-slate-400 placeholder:font-normal focus:outline-none focus:ring-2 focus:ring-[#0f3d64]/20 focus:bg-white"/>
        <button type="button" onclick="togglePassword()" aria-label="Hiện mật khẩu" class="absolute right-1.5 top-1/2 -translate-y-1/2 w-8 h-8 rounded-lg text-slate-400 hover:text-slate-700 flex items-center justify-center">
          <span class="material-symbols-outlined text-[20px]" id="loginPassIcon">visibility</span>
        </button>
      </div>
    </div>

    <div id="loginError" class="hidden p-2.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-[11px] font-bold items-center gap-1.5" role="alert">
      <span class="material-symbols-outlined text-[16px]">error</span><span id="loginErrorText">—</span>
    </div>

    <button id="loginSubmit" type="submit" class="w-full h-11 rounded-xl bg-[#0f3d64] hover:bg-[#1e588a] text-white text-xs font-bold shadow-sm flex items-center justify-center gap-1.5 active:scale-95 transition-all disabled:opacity-60 disabled:pointer-events-none">
      <span class="material-symbols-outlined text-[18px]" id="loginSubmitIcon">login</span><span id="loginSubmitLabel">Đăng nhập</span>
    </button>
  </form>

  <!-- Tài khoản demo -->
  <div class="flex flex-col gap-2.5">
    <div class="flex items-center justify-between px-1">
      <span class="text-[11px] font-extrabold text-slate-500 uppercase tracking-wider">Tài khoản demo</span>
      <span class="text-[10px] text-slate-400 font-mono">Mật khẩu: demo123</span>
    </div>
    <div class="flex flex-col gap-2.5" id="demoAccounts"></div>
  </div>

  <div class="mt-auto flex flex-col items-center gap-1.5 pt-4">
    <p class="text-[11px] text-slate-400 text-center leading-relaxed">Bấm vào một tài khoản demo để đăng nhập ngay. Trong app, bấm ảnh đại diện để đổi sang vai trò còn lại.</p>
    <span class="text-[10px] text-slate-300 font-mono">BĐS Suite • mockup v1.0</span>
  </div>
</div>

<script>
  // Dùng chung khóa lưu trữ với mobile.html & hr.html
  var SESSION_KEY = 'bds.session.v1';
  var ROLE_STORAGE_KEY = 'bds.role.v1';

  // Mockup không có máy chủ: 2 tài khoản demo, mỗi tài khoản 1 vai trò
  var ACCOUNTS = [
    { username: 'huy.nguyen', password: 'demo123', role: 'sale', file: 'mobile.html',
      name: 'Nguyễn Quang Huy', meta: 'NV-0012 • Chi nhánh Sala', roleLabel: 'Sale / CTV', icon: 'real_estate_agent' },
    { username: 'huong.tran', password: 'demo123', role: 'hr', file: 'hr.html',
      name: 'Trần Thị Thanh Hương', meta: 'NS-0004 • Trưởng phòng Nhân sự', roleLabel: 'Nhân sự (HR)', icon: 'groups' }
  ];

  function $(id) { return document.getElementById(id); }

  function readSession() {
    try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch (e) { return null; }
  }
  function goTo(file) { window.location.href = file; }

  function initials(name) {
    var parts = name.trim().split(/\s+/);
    return (parts[parts.length - 2][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  function renderDemoAccounts() {
    $('demoAccounts').innerHTML = ACCOUNTS.map(function (a, i) {
      return '<button type="button" onclick="quickLogin(' + i + ')" data-account="' + a.username + '" class="w-full p-3.5 rounded-2xl bg-white border border-slate-200 shadow-xs flex items-center gap-3 text-left active:scale-98 transition-all hover:border-[#0f3d64]/40">'
        + '<span class="w-11 h-11 rounded-full bg-[#0f3d64] text-white text-sm font-extrabold flex items-center justify-center shrink-0">' + initials(a.name) + '</span>'
        + '<span class="flex-1 min-w-0">'
        +   '<span class="flex items-center gap-1.5 min-w-0"><span class="text-xs font-extrabold text-slate-900 truncate">' + a.name + '</span>'
        +     '<span class="px-1.5 py-0.5 rounded-md bg-sky-50 text-[#0f3d64] border border-sky-200 text-[9px] font-bold shrink-0 flex items-center gap-0.5"><span class="material-symbols-outlined text-[12px]">' + a.icon + '</span>' + a.roleLabel + '</span></span>'
        +   '<span class="text-[10px] text-slate-500 font-mono block truncate mt-0.5">' + a.meta + '</span>'
        +   '<span class="text-[10px] text-slate-400 font-mono block truncate">' + a.username + '</span>'
        + '</span>'
        + '<span class="material-symbols-outlined text-[20px] text-slate-300 shrink-0">login</span>'
        + '</button>';
    }).join('');
  }

  function showLoginError(msg) {
    $('loginErrorText').textContent = msg;
    $('loginError').classList.remove('hidden');
    $('loginError').classList.add('flex');
  }
  function clearLoginError() {
    $('loginError').classList.add('hidden');
    $('loginError').classList.remove('flex');
  }

  function togglePassword() {
    var input = $('loginPass');
    var show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    $('loginPassIcon').textContent = show ? 'visibility_off' : 'visibility';
  }

  function setLoading(on) {
    $('loginSubmit').disabled = on;
    $('loginSubmitIcon').textContent = on ? 'progress_activity' : 'login';
    $('loginSubmitIcon').classList.toggle('animate-spin', on);
    $('loginSubmitLabel').textContent = on ? 'Đang đăng nhập...' : 'Đăng nhập';
  }

  // Bấm tài khoản demo: điền sẵn form rồi đăng nhập luôn
  function quickLogin(i) {
    var a = ACCOUNTS[i];
    $('loginUser').value = a.username;
    $('loginPass').value = a.password;
    submitLogin();
  }

  function submitLogin(e) {
    if (e) e.preventDefault();
    var username = $('loginUser').value.trim().toLowerCase();
    var password = $('loginPass').value;
    if (!username || !password) { showLoginError('Vui lòng nhập tên đăng nhập và mật khẩu.'); return; }
    var account = ACCOUNTS.filter(function (a) { return a.username === username && a.password === password; })[0];
    if (!account) { showLoginError('Tên đăng nhập hoặc mật khẩu không đúng.'); return; }
    clearLoginError();
    setLoading(true);
    setTimeout(function () { loginAs(account); }, 450);
  }

  function loginAs(account) {
    try {
      localStorage.setItem(SESSION_KEY, JSON.stringify({ username: account.username, role: account.role, name: account.name, loggedInAt: new Date().toISOString() }));
      localStorage.setItem(ROLE_STORAGE_KEY, JSON.stringify(account.role));
    } catch (e) { /* bỏ qua khi trình duyệt chặn lưu trữ */ }
    goTo(account.file);
  }

  // Luôn bắt đầu từ màn đăng nhập: vào trang này là xoá phiên cũ
  (function () {
    try { localStorage.removeItem(SESSION_KEY); } catch (e) { /* bỏ qua khi trình duyệt chặn lưu trữ */ }
    renderDemoAccounts();
  })();
</script>
</body>
</html>
